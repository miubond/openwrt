# 自托管 Gitea Runner，检出方式对齐 gim 的 deploy.yml。
# 单 job：编译、测试、构建 MP716 两种目标镜像并整理版本化产物。
# 不 sudo mkdir/chown，不拷贝到网站目录，不重启服务，不写路由器 Flash。
# 生产签名私钥不在这个工作流里使用。

name: MP716 Firmware Package

concurrency:
  group: mp716-firmware-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/lz
      - codex/mp716-firmware
    paths-ignore:
      - 'mp716-firmware-upgrade/web/**'
      - 'mp716-firmware-upgrade/docs/**'
  workflow_dispatch:
    inputs:
      build_only:
        description: "仅打包合成测试载荷，跳过目标镜像构建"
        type: boolean
        default: false

jobs:
  pipeline:
    name: Build & Package
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        id: repo
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf openwrt
          REPO="${{ github.server_url }}/${{ github.repository }}.git"
          case "$REPO" in
            https://*) CLONE_URL="https://oauth2:${GIT_TOKEN}@${REPO#https://}" ;;
            http://*)  CLONE_URL="http://oauth2:${GIT_TOKEN}@${REPO#http://}" ;;
            *)         CLONE_URL="$REPO" ;;
          esac
          git -c protocol.version=2 clone --depth 1 --branch "${{ github.ref_name }}" "$CLONE_URL" openwrt
          cd openwrt
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}"
          fi
          if [ -f mp716-firmware-upgrade/packer/mp716_fwpack.py ]; then
            echo "project=openwrt/mp716-firmware-upgrade" >> "$GITHUB_OUTPUT"
          elif [ -f packer/mp716_fwpack.py ]; then
            echo "project=openwrt" >> "$GITHUB_OUTPUT"
          else
            echo "找不到 packer/mp716_fwpack.py"
            exit 1
          fi
          echo "已检出 $(git rev-parse --short HEAD) @ ${{ github.ref_name }}"

      - name: Verify Environment
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          echo "### 环境验证 ###"
          echo "工作目录: $(pwd)"
          echo "项目目录: $PROJECT"
          echo "分支: ${{ github.ref_name }} SHA: ${{ github.sha }}"
          echo "build_only: ${{ inputs.build_only }}"
          ls -la "$PROJECT"
          test -f "$PROJECT/packer/mp716_fwpack.py"
          test -f "$PROJECT/tests/run_all.py"
          if ! command -v python3 >/dev/null 2>&1; then
            echo "Runner 未安装 python3"
            exit 1
          fi
          python3 --version
          if ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            echo "Runner 未安装 gcc 或 clang，无法编译设备端校验器"
            exit 1
          fi
          echo "本工作流不部署、不刷机。build_only=false 也不会写入设备。"

      - name: Python dependencies
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          if ! python3 -c "import cryptography" >/dev/null 2>&1; then
            python3 -m pip install --user -r "$PROJECT/packer/requirements.txt"
          fi
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Host build and tests
        run: |
          set -euo pipefail
          PROJECT="${{ steps.repo.outputs.project }}"
          cd "$PROJECT"
          mkdir -p build/host/unit build/ci-logs
          python3 scripts/build_host.py 2>&1 | tee build/ci-logs/host-build.log
          ./build/host/test_device build/host/unit 2>&1 | tee build/ci-logs/fake-mtd.log
          python3 tests/run_all.py 2>&1 | tee build/ci-logs/host-tests.log

      - name: Cross compile MIPS32r2 when the toolchain is already installed
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          if ! command -v mipsel-linux-gnu-gcc >/dev/null 2>&1; then
            echo "Runner 未安装 mipsel-linux-gnu-gcc，跳过交叉编译。"
            echo "测试升级包仍由主机打包器生成。本步骤不安装软件包，也不刷机。"
            exit 0
          fi
          make -C "$PROJECT/device" clean all \
            CC=mipsel-linux-gnu-gcc \
            CFLAGS_EXTRA="-mips32r2 -EL -mabi=32 -msoft-float"
          echo "MIPS 程序已编译，未执行，也未写入设备。"

      - name: Set up Node.js
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MP716 OpenWrt target images
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        timeout-minutes: 300
        run: |
          set -euo pipefail
          cd "${{ steps.repo.outputs.project }}"
          bash scripts/build-ci-images.sh

      - name: Package test container
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.repo.outputs.project }}"
          bash scripts/package-ci-test.sh "${{ github.workspace }}/build"

      - name: Stage versioned MP716 release
        id: release
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "${{ steps.repo.outputs.project }}"
          python3 scripts/stage-versioned-release.py --output build/publish --build-commit "$SOURCE_COMMIT" \
            --image initramfs build/ram-images build/ram-device.profile \
            --image sysupgrade build/target-images build/target-device.profile \
            --signed-test build/ci-release 2>&1 | tee build/ci-logs/stage-release.log
          version=$(cat config/firmware.version)
          (cd "build/publish/releases/$version/targets/ramips/mt76x8" && sha256sum -c sha256sums)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload versioned MP716 release
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: mp716-${{ steps.release.outputs.version }}-UNVERIFIED-${{ github.sha }}
          path: ${{ steps.repo.outputs.project }}/build/publish/
          if-no-files-found: error
          compression-level: 0

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: mp716upd-${{ github.sha }}
          path: |
            build/test.mp716upd
            build/test.mp716upd.sha256
            build/ci-test.pub
            build/*.json
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        run: |
          echo "打包完成，未部署，未刷机。"
          echo "产物目录: ${{ github.workspace }}/build"
          sha256sum build/test.mp716upd
          echo "原厂 BIN 不在仓库中，vendor-audit.json 应为 BLOCKED。"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mp716-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.repo.outputs.project }}/build/ci-logs/*.log
            ${{ steps.repo.outputs.project }}/build/ram-images/*.log
            ${{ steps.repo.outputs.project }}/build/target-images/*.log
            ${{ steps.repo.outputs.project }}/build/ci-release/*.json
          if-no-files-found: ignore

      - name: Cleanup build directory
        if: always()
        run: |
          find openwrt -name 'ci-test.priv' -delete 2>/dev/null || true
          if [ -d openwrt ]; then
            rm -rf openwrt
          fi
          if [ -d build ]; then
            rm -rf build
          fi
          echo "清理完成"
