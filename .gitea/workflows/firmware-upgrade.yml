# 自托管 Gitea Runner，检出方式对齐 gim 的 deploy.yml。
# 单 job：编译、测试、构建 MP716 两种目标镜像并整理版本化产物。
# 不 sudo mkdir/chown，不拷贝到网站目录，不重启服务，不写路由器 Flash。
# 生产签名私钥不在这个工作流里使用。

name: MP716 Firmware Package

concurrency:
  group: mp716-firmware-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/lz
      - codex/mp716-firmware
  workflow_dispatch:
    inputs:
      build_only:
        description: "仅打包合成测试载荷，跳过目标镜像构建"
        type: boolean
        default: false

jobs:
  pipeline:
    name: Build & Package
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        id: repo
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf openwrt
          REPO="${{ github.server_url }}/${{ github.repository }}.git"
          case "$REPO" in
            https://*) CLONE_URL="https://oauth2:${GIT_TOKEN}@${REPO#https://}" ;;
            http://*)  CLONE_URL="http://oauth2:${GIT_TOKEN}@${REPO#http://}" ;;
            *)         CLONE_URL="$REPO" ;;
          esac
          git -c protocol.version=2 clone --depth 1 --branch "${{ github.ref_name }}" "$CLONE_URL" openwrt
          cd openwrt
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}"
          fi
          if [ -f mp716-firmware-upgrade/packer/mp716_fwpack.py ]; then
            echo "project=openwrt/mp716-firmware-upgrade" >> "$GITHUB_OUTPUT"
          elif [ -f packer/mp716_fwpack.py ]; then
            echo "project=openwrt" >> "$GITHUB_OUTPUT"
          else
            echo "找不到 packer/mp716_fwpack.py"
            exit 1
          fi
          echo "已检出 $(git rev-parse --short HEAD) @ ${{ github.ref_name }}"

      - name: Verify Environment
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          echo "### 环境验证 ###"
          echo "工作目录: $(pwd)"
          echo "项目目录: $PROJECT"
          echo "分支: ${{ github.ref_name }} SHA: ${{ github.sha }}"
          echo "build_only: ${{ inputs.build_only }}"
          ls -la "$PROJECT"
          test -f "$PROJECT/packer/mp716_fwpack.py"
          test -f "$PROJECT/tests/run_all.py"
          if ! command -v python3 >/dev/null 2>&1; then
            echo "Runner 未安装 python3"
            exit 1
          fi
          python3 --version
          if ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            echo "Runner 未安装 gcc 或 clang，无法编译设备端校验器"
            exit 1
          fi
          echo "本工作流不部署、不刷机。build_only=false 也不会写入设备。"

      - name: Python dependencies
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          if ! python3 -c "import cryptography" >/dev/null 2>&1; then
            python3 -m pip install --user -r "$PROJECT/packer/requirements.txt"
          fi
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Host build and tests
        run: |
          set -euo pipefail
          PROJECT="${{ steps.repo.outputs.project }}"
          cd "$PROJECT"
          mkdir -p build/host/unit build/ci-logs
          python3 scripts/build_host.py 2>&1 | tee build/ci-logs/host-build.log
          ./build/host/test_device build/host/unit 2>&1 | tee build/ci-logs/fake-mtd.log
          python3 tests/run_all.py 2>&1 | tee build/ci-logs/host-tests.log

      - name: Cross compile MIPS32r2 when the toolchain is already installed
        run: |
          set -e
          PROJECT="${{ steps.repo.outputs.project }}"
          if ! command -v mipsel-linux-gnu-gcc >/dev/null 2>&1; then
            echo "Runner 未安装 mipsel-linux-gnu-gcc，跳过交叉编译。"
            echo "测试升级包仍由主机打包器生成。本步骤不安装软件包，也不刷机。"
            exit 0
          fi
          make -C "$PROJECT/device" clean all \
            CC=mipsel-linux-gnu-gcc \
            CFLAGS_EXTRA="-mips32r2 -EL -mabi=32 -msoft-float"
          echo "MIPS 程序已编译，未执行，也未写入设备。"

      - name: Set up Node.js
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MP716 OpenWrt target images
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        timeout-minutes: 300
        run: |
          set -euo pipefail
          cd "${{ steps.repo.outputs.project }}"
          mkdir -p build/target-images build/ram-images build/ci-logs
          FIRMWARE_VERSION=$(cat config/firmware.version)
          sed "s/^installed_custom_firmware=.*/installed_custom_firmware=$FIRMWARE_VERSION/" \
            config/test-device.profile > build/target-device.profile
          npm ci --prefix web --no-audit --no-fund 2>&1 | tee build/ci-logs/npm-ci.log
          npm run --prefix web build 2>&1 | tee build/ci-logs/vue-build.log
          bash scripts/build-openwrt-cached.sh --lan-candidate web/dist \
            build/target-device.profile build/target-images 2>&1 | tee build/ci-logs/sysupgrade.log
          (cd build/target-images && sha256sum -c SHA256SUMS)
          bash scripts/build-openwrt-cached.sh --ram-web web/dist \
            config/test-device.profile build/ram-images 2>&1 | tee build/ci-logs/initramfs.log
          (cd build/ram-images && sha256sum -c SHA256SUMS)
          set -- build/target-images/*-yunxm_mp716-squashfs-sysupgrade.bin
          test "$#" -eq 1
          cp "$1" build/payload.bin

      - name: Package test container
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.repo.outputs.project }}"
          ARTIFACT_DIR="${{ github.workspace }}/build"
          mkdir -p "$ARTIFACT_DIR"
          cd "$PROJECT"
          verify_report() {
            local report=$1 status
            shift
            if "$@" > "$report"; then
              cat "$report"
            else
              status=$?
              cat "$report" >&2
              return "$status"
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from tests.support.images import uimage_payload
          root = Path("build/ci-release")
          root.mkdir(parents=True, exist_ok=True)
          key = root / "ci-test.priv"
          seed = Ed25519PrivateKey.generate()
          key.write_bytes(seed.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption()))
          payload = Path("build/payload.bin")
          if not payload.exists():
              payload.write_bytes(uimage_payload())
          PY
          python3 packer/mp716_fwpack.py pack \
            --payload build/payload.bin \
            --private-key build/ci-release/ci-test.priv \
            --out build/ci-release/test.mp716upd \
            --hardware-revision ci-lab \
            --firmware-version "$(cat config/firmware.version)" \
            --build-time 2026-11-13T00:00:00Z 2>&1 | tee build/ci-logs/pack-test-container.log
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          seed = Path("build/ci-release/ci-test.priv").read_bytes()
          pub = Ed25519PrivateKey.from_private_bytes(seed).public_key().public_bytes(
              serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          Path("build/ci-release/upgrade.pub").write_bytes(pub)
          Path("build/ci-release/device.profile").write_text(
              "product=MP716\nhardware_revision=ci-lab\nbase_firmware=014\n"
              "vendor_software_version=014\ninstalled_custom_firmware=\n"
              "web_ui=1.0.0\nupgrade_engine=1.0.0\n",
              encoding="utf-8")
          PY
          verify_report build/ci-release/verify.json \
            python3 packer/mp716_fwverify.py build/ci-release/test.mp716upd \
            --public-key build/ci-release/upgrade.pub \
            --profile build/ci-release/device.profile
          audit_code=0
          python3 packer/audit_vendor_image.py > build/ci-release/vendor-audit.json || audit_code=$?
          cat build/ci-release/vendor-audit.json
          test "$audit_code" -eq 2
          rm -f build/ci-release/ci-test.priv build/payload.bin
          (cd build/ci-release && sha256sum test.mp716upd > test.mp716upd.sha256)
          verify_report build/ci-release/device-verify.json \
            ./build/host/mp716-upgraded check --root build/ci-release \
            --image build/ci-release/test.mp716upd
          if [ -d build/target-images ]; then
            verify_report build/ci-release/stage-verify.json \
              ./build/host/mp716-upgraded check --root build/ci-release \
              --image build/ci-release/test.mp716upd --meminfo /proc/meminfo \
              --extract build/ci-release/extracted.bin \
              --pending-state build/ci-release/sysupgrade.pending
            set -- build/target-images/*-yunxm_mp716-squashfs-sysupgrade.bin
            cmp "$1" build/ci-release/extracted.bin
            cp build/target-device.profile build/ci-release/running.profile
            verify_report build/ci-release/boot-verify.json \
              ./build/host/mp716-upgraded boot-verify --root build/ci-release
            cp build/ci-release/boot-verify.json "$ARTIFACT_DIR/"
          fi
          cp build/ci-release/upgrade.pub "$ARTIFACT_DIR/ci-test.pub"
          cp -v build/ci-release/test.mp716upd \
                build/ci-release/test.mp716upd.sha256 \
                build/ci-release/verify.json \
                build/ci-release/device-verify.json \
                build/ci-release/vendor-audit.json \
                "$ARTIFACT_DIR/"
          echo "测试升级包已生成。这不是生产签名，也没有写入设备。"

      - name: Stage versioned MP716 release
        id: release
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "${{ steps.repo.outputs.project }}"
          python3 scripts/stage-versioned-release.py --output build/publish --build-commit "$SOURCE_COMMIT" \
            --image initramfs build/ram-images config/test-device.profile \
            --image sysupgrade build/target-images build/target-device.profile \
            --signed-test build/ci-release 2>&1 | tee build/ci-logs/stage-release.log
          version=$(cat config/firmware.version)
          (cd "build/publish/releases/$version/targets/ramips/mt76x8" && sha256sum -c sha256sums)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload versioned MP716 release
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: mp716-${{ steps.release.outputs.version }}-UNVERIFIED-${{ github.sha }}
          path: ${{ steps.repo.outputs.project }}/build/publish/
          if-no-files-found: error
          compression-level: 0

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: mp716upd-${{ github.sha }}
          path: |
            build/test.mp716upd
            build/test.mp716upd.sha256
            build/ci-test.pub
            build/*.json
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        run: |
          echo "打包完成，未部署，未刷机。"
          echo "产物目录: ${{ github.workspace }}/build"
          sha256sum build/test.mp716upd
          echo "原厂 BIN 不在仓库中，vendor-audit.json 应为 BLOCKED。"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mp716-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.repo.outputs.project }}/build/ci-logs/*.log
            ${{ steps.repo.outputs.project }}/build/ram-images/*.log
            ${{ steps.repo.outputs.project }}/build/target-images/*.log
            ${{ steps.repo.outputs.project }}/build/ci-release/*.json
          if-no-files-found: ignore

      - name: Cleanup build directory
        if: always()
        run: |
          find openwrt -name 'ci-test.priv' -delete 2>/dev/null || true
          if [ -d openwrt ]; then
            rm -rf openwrt
          fi
          if [ -d build ]; then
            rm -rf build
          fi
          echo "清理完成"
