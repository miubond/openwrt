name: MP716 RAM Web Verification

on:
  push:
    branches:
      - codex/mp716-ram-web
  workflow_dispatch:

jobs:
  initramfs:
    runs-on: self-hosted
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build inputs
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p mp716-ram-web-work/project mp716-ram-web-output
          git -C mp716-ram-web-work/project init
          AUTH=$(printf 'oauth2:%s' "$GIT_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $AUTH" \
            git -C mp716-ram-web-work/project fetch --depth 1 "$REPOSITORY_URL" "$SOURCE_COMMIT"
          git -C mp716-ram-web-work/project checkout --detach FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and inspect RAM-only initramfs
        run: |
          set -euo pipefail
          project=mp716-ram-web-work/project/mp716-firmware-upgrade
          npm ci --prefix "$project/web" --no-audit --no-fund 2>&1 | tee mp716-ram-web-output/npm-ci.log
          npm run --prefix "$project/web" build 2>&1 | tee mp716-ram-web-output/vue-build.log
          bash "$project/scripts/build-openwrt-cached.sh" --ram-web \
            "$project/web/dist" "$project/config/test-device.profile" mp716-ram-web-output \
            2>&1 | tee mp716-ram-web-output/compile.log
          (cd mp716-ram-web-output && sha256sum -c SHA256SUMS)

      - name: Stage versioned MP716 release
        id: release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          project=mp716-ram-web-work/project/mp716-firmware-upgrade
          python3 "$project/scripts/stage-versioned-release.py" --output mp716-ram-web-work/publish \
            --build-commit "$SOURCE_COMMIT" \
            --image initramfs mp716-ram-web-output "$project/config/test-device.profile" \
            2>&1 | tee mp716-ram-web-output/stage-release.log
          version=$(cat "$project/config/firmware.version")
          (cd "mp716-ram-web-work/publish/releases/$version/targets/ramips/mt76x8" && sha256sum -c sha256sums)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload RAM image
        uses: actions/upload-artifact@v4
        with:
          name: mp716-initramfs-${{ steps.release.outputs.version }}-UNVERIFIED-${{ github.sha }}
          path: mp716-ram-web-work/publish/
          if-no-files-found: error
          compression-level: 0

      - name: Upload RAM build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mp716-initramfs-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: mp716-ram-web-output/*.log
          if-no-files-found: ignore

      - name: Clean build files
        if: always()
        run: rm -rf -- mp716-ram-web-work mp716-ram-web-output
